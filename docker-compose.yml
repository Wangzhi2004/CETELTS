services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cetelts-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - app-tmp:/app/.tmp

  db-setup:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: cetelts-db-setup
    env_file:
      - .env.production
    command: ["npx", "prisma", "db", "push", "--skip-generate"]

  nginx:
    image: nginx:alpine
    container_name: cetelts-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app

volumes:
  app-tmp: